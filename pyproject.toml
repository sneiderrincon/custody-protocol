[tool.poetry]
name = "medical-device-custody-kernel"
version = "0.1.0"
description = "Append-only identity and custody kernel for verifiable medical device lifecycle claims."
authors = ["Kernel Maintainers <kernel@example.invalid>"]
readme = "README.md"
packages = [
  { include = "kernel" },
  { include = "adapters" },
  { include = "api" },
  { include = "sdk" }
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
pydantic = "^2.8"
fastapi = "^0.115"
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg = {version = "^3.2", extras = ["binary"]}
uvicorn = "^0.32"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
hypothesis = "^6.112"
ruff = "^0.6"
mutmut = "^2.5"
mypy = "^1.13"
pytest-cov = "^6.0"
httpx = "^0.27"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "PL", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["kernel", "api", "sdk"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kernel --cov=api --cov=sdk --cov-report=term-missing"
