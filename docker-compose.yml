services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kernel
      POSTGRES_USER: kernel
      POSTGRES_PASSWORD: kernel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://kernel:kernel@postgres:5432/kernel
      JWT_SECRET_KEY: change-me-in-production
      RATE_LIMIT_WRITE_MAX_REQUESTS: "60"
      RATE_LIMIT_WRITE_WINDOW_SECONDS: "60"
      # Comma-separated browser origins allowed to call this API from the
      # console (docs/decisions/0014-cors-configuration.md). Empty = no
      # browser origin allowed (fail closed). Example for local use:
      # CORS_ALLOWED_ORIGINS: "http://localhost:5500"
      CORS_ALLOWED_ORIGINS: ""
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres-data:

