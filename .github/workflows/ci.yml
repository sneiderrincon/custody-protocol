name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest hypothesis ruff mypy pytest-cov httpx pre-commit
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy kernel api sdk
      - name: Test
        run: pytest
      - name: OpenAPI
        run: python scripts/export_openapi.py
